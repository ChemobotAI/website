<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 750" role="img" aria-labelledby="title desc">
  <title id="title">Networked chemical robots concept</title>
  <desc id="desc">A concept graphic showing multiple chemistry robots connected through a shared network and chemical search space.</desc>
