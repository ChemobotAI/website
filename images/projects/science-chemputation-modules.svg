    <rect x="790" y="250" width="180" height="150" rx="8"/>
    <rect x="1080" y="250" width="180" height="150" rx="8"/>
  </g>
  <g fill="#fff" font-family="Manrope, Arial, sans-serif" font-size="22" text-anchor="middle">
